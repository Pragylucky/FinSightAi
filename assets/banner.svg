<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" font-family="Inter,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0A14"/><stop offset="1" stop-color="#1A1233"/></linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
    <linearGradient id="gv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8B5CF6"/><stop offset="0.6" stop-color="#C084FC"/><stop offset="1" stop-color="#00E676"/></linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8B5CF6" stop-opacity="0.38"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></linearGradient>
    <radialGradient id="oa"><stop offset="0" stop-color="#8B5CF6" stop-opacity="0.5"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
    <radialGradient id="ob"><stop offset="0" stop-color="#F472B6" stop-opacity="0.38"/><stop offset="1" stop-color="#F472B6" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity="0.04"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="c"><rect width="1280" height="420" rx="22"/></clipPath>
    <clipPath id="tk"><rect x="0" y="0" width="1280" height="44"/></clipPath>
  </defs>
  <style>
    .oa{animation:da 10s ease-in-out infinite alternate}
    .ob{animation:db 13s ease-in-out infinite alternate}
    @keyframes da{to{transform:translate(120px,50px)}}
    @keyframes db{to{transform:translate(-140px,-40px)}}
    .tick{animation:scroll 34s linear infinite}
    @keyframes scroll{to{transform:translateX(-1100px)}}
    .draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 3.2s .6s cubic-bezier(.4,0,.2,1) forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    .area{opacity:0;animation:fade 1.4s 2.4s ease-out forwards}
    @keyframes fade{to{opacity:1}}
    .rise{opacity:0;transform:translateY(18px);animation:rise .9s ease-out forwards}
    @keyframes rise{to{opacity:1;transform:none}}
    .bar{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:grow .9s cubic-bezier(.3,1.4,.5,1) forwards}
    @keyframes grow{to{transform:scaleY(1)}}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
    @keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(4.5);opacity:0}}
    .bolt{transform-box:fill-box;transform-origin:center;animation:bob 3.4s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(-4deg)}}
    .shine{animation:shine 5s ease-in-out 3s infinite}
    @keyframes shine{0%{transform:translateX(-300px)}60%,100%{transform:translateX(900px)}}
    .blink{animation:blink 1.1s steps(2) infinite}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}}
  </style>

  <g clip-path="url(#c)">
    <rect width="1280" height="420" fill="url(#bg)"/>
    <rect width="1280" height="420" fill="url(#grid)"/>
    <circle class="oa" cx="220" cy="260" r="260" fill="url(#oa)"/>
    <circle class="ob" cx="1080" cy="320" r="280" fill="url(#ob)"/>

    <!-- ticker strip -->
    <rect width="1280" height="44" fill="#07060E" fill-opacity="0.85"/>
    <line x1="0" y1="44" x2="1280" y2="44" stroke="#fff" stroke-opacity="0.08"/>
    <g clip-path="url(#tk)">
      <g class="tick" font-family="'SF Mono',Menlo,Consolas,monospace" font-size="14" font-weight="600">
        <g id="items">
          <text x="110" y="28" fill="#A8A3C7">NIFTY 50 <tspan fill="#00E676">▲ +2.40%</tspan></text>
          <text x="310" y="28" fill="#A8A3C7">SENSEX <tspan fill="#00E676">▲ +2.60%</tspan></text>
          <text x="500" y="28" fill="#A8A3C7">RELIANCE <tspan fill="#00E676">▲ +0.18%</tspan></text>
          <text x="710" y="28" fill="#A8A3C7">BHARTIARTL <tspan fill="#FF3B5C">▼ −0.52%</tspan></text>
          <text x="930" y="28" fill="#A8A3C7">HDFCBANK <tspan fill="#00E676">▲ +3.16%</tspan></text>
        </g>
        <g transform="translate(1100 0)">
          <text x="110" y="28" fill="#A8A3C7">NIFTY 50 <tspan fill="#00E676">▲ +2.40%</tspan></text>
          <text x="310" y="28" fill="#A8A3C7">SENSEX <tspan fill="#00E676">▲ +2.60%</tspan></text>
          <text x="500" y="28" fill="#A8A3C7">RELIANCE <tspan fill="#00E676">▲ +0.18%</tspan></text>
          <text x="710" y="28" fill="#A8A3C7">BHARTIARTL <tspan fill="#FF3B5C">▼ −0.52%</tspan></text>
          <text x="930" y="28" fill="#A8A3C7">HDFCBANK <tspan fill="#00E676">▲ +3.16%</tspan></text>
        </g>
        <g transform="translate(2200 0)">
          <text x="110" y="28" fill="#A8A3C7">NIFTY 50 <tspan fill="#00E676">▲ +2.40%</tspan></text>
          <text x="310" y="28" fill="#A8A3C7">SENSEX <tspan fill="#00E676">▲ +2.60%</tspan></text>
        </g>
      </g>
    </g>
    <rect width="86" height="44" fill="#07060E"/>
    <circle cx="22" cy="22" r="4" fill="#00E676"/><circle class="pulse" cx="22" cy="22" r="4" fill="#00E676"/>
    <text x="34" y="27" font-size="12" font-weight="700" fill="#00E676" letter-spacing="1.5">LIVE</text>

    <!-- logo + title -->
    <g class="rise" style="animation-delay:.2s">
      <g class="bolt">
        <rect x="80" y="110" width="76" height="76" rx="20" fill="url(#gv)" filter="url(#glow)"/>
        <path d="M122 127 L100 157 H117 L112 178 L136 146 H119 Z" fill="#fff"/>
      </g>
    </g>
    <g class="rise" style="animation-delay:.45s">
      <text x="176" y="170" font-size="70" font-weight="800" fill="#fff" letter-spacing="-2">FinSight <tspan fill="url(#g)">AI</tspan></text>
    </g>
    <g class="rise" style="animation-delay:.8s">
      <text x="82" y="228" font-size="24" fill="#C9C5E6" font-weight="500">Research Indian stocks with live data and an AI that</text>
      <text x="82" y="259" font-size="24" fill="#C9C5E6" font-weight="500">shows its sources<tspan class="blink" fill="#8B5CF6">▍</tspan></text>
    </g>

    <!-- chips -->
    <g font-size="14" font-weight="600" fill="#D8D2FF">
      <g class="rise" style="animation-delay:1.2s"><rect x="82" y="300" width="92" height="34" rx="17" fill="#8B5CF6" fill-opacity="0.15" stroke="#8B5CF6" stroke-opacity="0.5"/><text x="128" y="322" text-anchor="middle">React 19</text></g>
      <g class="rise" style="animation-delay:1.35s"><rect x="184" y="300" width="94" height="34" rx="17" fill="#8B5CF6" fill-opacity="0.15" stroke="#8B5CF6" stroke-opacity="0.5"/><text x="231" y="322" text-anchor="middle">Node API</text></g>
      <g class="rise" style="animation-delay:1.5s"><rect x="288" y="300" width="100" height="34" rx="17" fill="#8B5CF6" fill-opacity="0.15" stroke="#8B5CF6" stroke-opacity="0.5"/><text x="338" y="322" text-anchor="middle">MongoDB</text></g>
      <g class="rise" style="animation-delay:1.65s"><rect x="398" y="300" width="110" height="34" rx="17" fill="#F472B6" fill-opacity="0.15" stroke="#F472B6" stroke-opacity="0.5"/><text x="453" y="322" text-anchor="middle">Gemini AI</text></g>
      <g class="rise" style="animation-delay:1.8s"><rect x="518" y="300" width="104" height="34" rx="17" fill="#00E676" fill-opacity="0.12" stroke="#00E676" stroke-opacity="0.45"/><text x="570" y="322" text-anchor="middle">265 stocks</text></g>
    </g>

    <!-- chart card -->
    <g class="rise" style="animation-delay:.5s">
      <rect x="700" y="86" width="500" height="290" rx="22" fill="#14112A" fill-opacity="0.86" stroke="#fff" stroke-opacity="0.1"/>
      <text x="728" y="122" font-size="13" fill="#8F8AB5" font-weight="600" letter-spacing="2">NIFTY 50</text>
      <text x="728" y="162" font-size="38" font-weight="800" fill="#fff" font-family="'SF Mono',Menlo,Consolas,monospace">24,536.60</text>
      <rect x="962" y="138" width="92" height="30" rx="15" fill="#00E676" fill-opacity="0.16"/>
      <text x="1008" y="159" font-size="15" font-weight="700" fill="#00E676" text-anchor="middle">▲ +2.40%</text>
      <g stroke="#fff" stroke-opacity="0.06"><line x1="728" y1="215" x2="1172" y2="215"/><line x1="728" y1="255" x2="1172" y2="255"/><line x1="728" y1="295" x2="1172" y2="295"/></g>
      <path class="area" d="M728 330 C760 320 775 300 800 306 S850 330 880 296 S930 270 960 280 S1010 262 1040 240 S1100 212 1132 214 L1172 196 L1172 340 L728 340Z" fill="url(#area)"/>
      <path class="draw" d="M728 330 C760 320 775 300 800 306 S850 330 880 296 S930 270 960 280 S1010 262 1040 240 S1100 212 1132 214 L1172 196" fill="none" stroke="url(#line)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
      <g class="area"><circle cx="1172" cy="196" r="6" fill="#00E676"/><circle class="pulse" cx="1172" cy="196" r="6" fill="#00E676"/></g>
      <!-- volume bars -->
      <g fill="url(#gv)" fill-opacity="0.55">
        <rect class="bar" style="animation-delay:2.0s" x="740" y="346" width="14" height="14" rx="3"/>
        <rect class="bar" style="animation-delay:2.1s" x="772" y="340" width="14" height="20" rx="3"/>
        <rect class="bar" style="animation-delay:2.2s" x="804" y="344" width="14" height="16" rx="3"/>
        <rect class="bar" style="animation-delay:2.3s" x="836" y="334" width="14" height="26" rx="3"/>
        <rect class="bar" style="animation-delay:2.4s" x="868" y="342" width="14" height="18" rx="3"/>
        <rect class="bar" style="animation-delay:2.5s" x="900" y="330" width="14" height="30" rx="3"/>
        <rect class="bar" style="animation-delay:2.6s" x="932" y="338" width="14" height="22" rx="3"/>
        <rect class="bar" style="animation-delay:2.7s" x="964" y="332" width="14" height="28" rx="3"/>
        <rect class="bar" style="animation-delay:2.8s" x="996" y="340" width="14" height="20" rx="3"/>
        <rect class="bar" style="animation-delay:2.9s" x="1028" y="328" width="14" height="32" rx="3"/>
        <rect class="bar" style="animation-delay:3.0s" x="1060" y="336" width="14" height="24" rx="3"/>
        <rect class="bar" style="animation-delay:3.1s" x="1092" y="326" width="14" height="34" rx="3"/>
        <rect class="bar" style="animation-delay:3.2s" x="1124" y="332" width="14" height="28" rx="3"/>
        <rect class="bar" style="animation-delay:3.3s" x="1156" y="322" width="14" height="38" rx="3"/>
      </g>
    </g>

    <!-- shine sweep -->
    <g class="shine" opacity="0.5"><path d="M0 0 L60 0 L0 420 L-60 420Z" fill="#fff" fill-opacity="0.05"/></g>
    <rect x="1" y="1" width="1278" height="418" rx="21" fill="none" stroke="#fff" stroke-opacity="0.1"/>
  </g>
</svg>
